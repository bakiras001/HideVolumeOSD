name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild HideVolumeOSD.sln /t:Rebuild /p:Configuration=Release /p:Platform=x86 /v:m

      - uses: actions/upload-artifact@v4
        with:
          name: HideVolumeOSD-x86
          path: |
            x86/Release/HideVolumeOSD.exe
            x86/Release/HideVolumeOSD.exe.config
